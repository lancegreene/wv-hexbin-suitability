[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexbin-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "rasterio>=1.3",
  "rasterstats>=0.19",
  "h3>=4.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hexbin_pipeline*"]
